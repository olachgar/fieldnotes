[project]
name = "firebase-notes-mcp"
version = "0.1.0"
description = "FastAPI REST and MCP server for Firebase Cloud Firestore notes"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "firebase-admin>=6.5,<8",
    "mcp>=2.2,<3",
    "pydantic-settings>=2.6,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/auth.py" = ["B008"]
"app/main.py" = ["B008"]
